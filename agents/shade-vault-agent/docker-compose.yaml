services:
  payrouta-vault-agent:
    environment:
      AGENT_CONTRACT_ID: ${AGENT_CONTRACT_ID}
      NEAR_NETWORK: ${NEAR_NETWORK}
      SPONSOR_ACCOUNT_ID: ${SPONSOR_ACCOUNT_ID}
      SPONSOR_PRIVATE_KEY: ${SPONSOR_PRIVATE_KEY}
      PAYROUTA_URL: ${PAYROUTA_URL}
      EVM_RPC_URL: ${EVM_RPC_URL}
    platform: linux/amd64
    # shade deploy builds the image and pins this to its digest.
    image: YOUR_DOCKERHUB_USER/payrouta-vault-agent:latest
    container_name: payrouta-vault-agent
    ports:
      - 3000:3000
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    restart: always
