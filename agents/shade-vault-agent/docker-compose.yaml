services:
  shade-agent-app:
    environment:
      AGENT_CONTRACT_ID: ${AGENT_CONTRACT_ID}
      NEAR_NETWORK: ${NEAR_NETWORK}
      SPONSOR_ACCOUNT_ID: ${SPONSOR_ACCOUNT_ID}
      SPONSOR_PRIVATE_KEY: ${SPONSOR_PRIVATE_KEY}
      PAYROUTA_URL: ${PAYROUTA_URL}
      EVM_RPC_URL: ${EVM_RPC_URL}
    platform: linux/amd64
    image: ghcr.io/hackcat29/payrouta-vault-agent@sha256:46a4aafdd77b1023e6fea83407c7161b6d86cf9240ed0b36feab88a9766eac9c
    container_name: payrouta-vault-agent
    ports:
      - 3000:3000
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    restart: always
