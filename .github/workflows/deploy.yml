name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: payrouta
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: payrouta
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U payrouta" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Isolated, fictional CI environment only.
      DATABASE_URL: postgresql://payrouta@127.0.0.1:55432/payrouta
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      PORTAL_MODE: local
      LOCAL_DATA_DIR: .local/portal
      LOCAL_VAULT_KEY_FILE: /tmp/payrouta-ci-vault.key
      EVIDENCE_RETENTION_DAYS: "90"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: head -c 32 /dev/urandom > /tmp/payrouta-ci-vault.key && chmod 600 /tmp/payrouta-ci-vault.key
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm test
      - run: npm run test:payments
      - run: npm run test:merchant
      - run: npm run test:partners
      - run: npm run test:treasury
      - run: npm run test:intents
      - run: npm run build

  deploy:
    name: Deploy to server
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v4
      # Only tracked files are shipped: no node_modules, .git or local data.
      - run: git archive --format=tar.gz -o release.tgz HEAD
      - name: Upload release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          source: release.tgz
          target: /opt/payrouta/incoming
      - name: Build, migrate, preflight and switch
        uses: appleboy/ssh-action@v1.0.3
        env:
          SHA: ${{ github.sha }}
          # Optional: synced into the server's .env when set (never echoed).
          OPENSANCTIONS_API_KEY: ${{ secrets.OPENSANCTIONS_API_KEY }}
          # Cloudflare Turnstile on the public forms. The check is enforced
          # once the secret key is on the server; the site key is read at build.
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ vars.NEXT_PUBLIC_PRIVY_APP_ID }}
          NEXT_PUBLIC_PRIVY_CLIENT_ID: ${{ vars.NEXT_PUBLIC_PRIVY_CLIENT_ID }}
          # PayRouta's NEAR Intents account, paid its fee at source on crypto
          # checkouts (lib/intents/checkout.ts feeAccount).
          PAYROUTA_INTENTS_FEE_ACCOUNT: ${{ vars.PAYROUTA_INTENTS_FEE_ACCOUNT }}
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          envs: SHA,OPENSANCTIONS_API_KEY,TURNSTILE_SECRET_KEY,NEXT_PUBLIC_TURNSTILE_SITE_KEY,NEXT_PUBLIC_PRIVY_APP_ID,NEXT_PUBLIC_PRIVY_CLIENT_ID,PAYROUTA_INTENTS_FEE_ACCOUNT
          script_stop: true
          script: |
            echo "==> Deploy started for SHA: $SHA"
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            elif [ -s "/root/.nvm/nvm.sh" ]; then
              export NVM_DIR="/root/.nvm"
              . "$NVM_DIR/nvm.sh"
            fi
            echo "==> Node: $(node -v 2>/dev/null || echo 'not found in PATH')"
            echo "==> NPM: $(npm -v 2>/dev/null || echo 'not found in PATH')"
            echo "==> PM2: $(which pm2 2>/dev/null || echo 'not found in PATH')"
            set -euo pipefail
            ROOT=/opt/payrouta
            # Sync secrets kept in GitHub into the server's .env, replacing
            # any old line; values are never printed.
            if [ -n "${OPENSANCTIONS_API_KEY:-}" ]; then
              (
                umask 077
                grep -v '^OPENSANCTIONS_API_KEY=' "$ROOT/.env" > "$ROOT/.env.sync" || true
                printf 'OPENSANCTIONS_API_KEY=%s\n' "$OPENSANCTIONS_API_KEY" >> "$ROOT/.env.sync"
                cat "$ROOT/.env.sync" > "$ROOT/.env"
                rm -f "$ROOT/.env.sync"
              )
              echo "==> OpenSanctions key synced from GitHub"
            fi
            sync_env() {
              [ -n "$2" ] || return 0
              (
                umask 077
                grep -v "^$1=" "$ROOT/.env" > "$ROOT/.env.sync" || true
                printf '%s=%s\n' "$1" "$2" >> "$ROOT/.env.sync"
                cat "$ROOT/.env.sync" > "$ROOT/.env"
                rm -f "$ROOT/.env.sync"
              )
              echo "==> $1 synced from GitHub"
            }
            sync_env TURNSTILE_SECRET_KEY "${TURNSTILE_SECRET_KEY:-}"
            sync_env NEXT_PUBLIC_TURNSTILE_SITE_KEY "${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}"
            sync_env NEXT_PUBLIC_PRIVY_APP_ID "${NEXT_PUBLIC_PRIVY_APP_ID:-}"
            sync_env NEXT_PUBLIC_PRIVY_CLIENT_ID "${NEXT_PUBLIC_PRIVY_CLIENT_ID:-}"
            sync_env PAYROUTA_INTENTS_FEE_ACCOUNT "${PAYROUTA_INTENTS_FEE_ACCOUNT:-}"
            if grep -q '^OPENSANCTIONS_API_KEY=.' "$ROOT/.env"; then
              echo "==> OpenSanctions key present: automated merchant screening on"
            else
              echo "==> OpenSanctions key missing: every business waits for manual review"
            fi
            REL="$ROOT/releases/$SHA"
            PREV="$(readlink -f "$ROOT/current" || true)"
            mkdir -p "$REL"
            echo "==> Extracting release archive..."
            tar -xzf "$ROOT/incoming/release.tgz" -C "$REL"
            ln -sfn "$ROOT/.env" "$REL/.env"
            cd "$REL"
            echo "==> Installing dependencies..."
            npm ci
            echo "==> Generating Prisma client..."
            npx prisma generate
            echo "==> Running database migrations..."
            npx prisma migrate deploy
            echo "==> Building standalone application..."
            npm run build
            cp -r public .next/standalone/
            cp -r .next/static .next/standalone/.next/
            echo "==> Running production preflight..."
            npm run preflight:production -- --warn || true
            echo "==> Stopping legacy PM2 service if present..."
            pm2 stop payrouta 2>/dev/null || true
            pm2 delete payrouta 2>/dev/null || true
            echo "==> Switching current release link to $REL..."
            ln -sfn "$REL" "$ROOT/current"
            echo "==> Reloading PM2 services..."
            pm2 startOrReload "$REL/ecosystem.config.cjs" --update-env
            echo "==> Checking health endpoint (http://127.0.0.1:3051/api/health)..."
            ok=0
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:3051/api/health >/dev/null; then ok=1; break; fi
              sleep 3
            done
            if [ "$ok" != 1 ]; then
              echo "Health check failed; rolling back to $PREV"
              if [ -n "$PREV" ] && [ -d "$PREV" ]; then
                ln -sfn "$PREV" "$ROOT/current"
                if [ -f "$PREV/ecosystem.config.cjs" ]; then
                  pm2 startOrReload "$PREV/ecosystem.config.cjs" --update-env || true
                elif [ -f "$PREV/.next/standalone/server.js" ]; then
                  PORT=3051 pm2 start "$PREV/.next/standalone/server.js" --name "payrouta" || true
                fi
              fi
              exit 1
            fi
            echo "==> Health check passed! Saving PM2 state..."
            pm2 save
            ls -1dt "$ROOT"/releases/* | tail -n +6 | xargs -r rm -rf
            echo "==> Deployment finished successfully!"

