name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: payrouta
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: payrouta
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U payrouta" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Isolated, fictional CI environment only.
      DATABASE_URL: postgresql://payrouta@127.0.0.1:55432/payrouta
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      PORTAL_MODE: local
      LOCAL_DATA_DIR: .local/portal
      LOCAL_VAULT_KEY_FILE: /tmp/payrouta-ci-vault.key
      EVIDENCE_RETENTION_DAYS: "90"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: head -c 32 /dev/urandom > /tmp/payrouta-ci-vault.key && chmod 600 /tmp/payrouta-ci-vault.key
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm test
      - run: npm run test:payments
      - run: npm run test:merchant
      - run: npm run test:partners
      - run: npm run test:treasury
      - run: npm run test:intents
      - run: npm run build

  deploy:
    name: Deploy to server
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v4
      # The app is built here, not on the server: the server is shared and
      # often fully loaded, and building there took 13-22 minutes. Node 22
      # and Ubuntu 24.04 x64 match the server.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build the standalone app
        env:
          NODE_ENV: production
          PORTAL_MODE: production
          # Read at build time: public origins and the public client keys.
          # Server-only settings are read from the server's .env at runtime.
          SITE_URL: https://payrouta.com
          BETTER_AUTH_URL: https://payrouta.com
          BETTER_AUTH_SECRET: build-only-never-used-at-runtime-0123456789
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ vars.NEXT_PUBLIC_PRIVY_APP_ID }}
          NEXT_PUBLIC_PRIVY_CLIENT_ID: ${{ vars.NEXT_PUBLIC_PRIVY_CLIENT_ID }}
        run: |
          npm run build
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          tar -czf build.tgz -C .next standalone
      # Only tracked files are shipped as source: no node_modules, .git or local data.
      - run: git archive --format=tar.gz -o release.tgz HEAD
      - name: Upload release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          source: release.tgz,build.tgz
          target: /opt/payrouta/incoming
      - name: Migrate, preflight and switch
        uses: appleboy/ssh-action@v1.0.3
        env:
          SHA: ${{ github.sha }}
          # Optional: synced into the server's .env when set (never echoed).
          OPENSANCTIONS_API_KEY: ${{ secrets.OPENSANCTIONS_API_KEY }}
          # Cloudflare Turnstile on the public forms. The check is enforced
          # once the secret key is on the server; the site key is read at build.
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ vars.NEXT_PUBLIC_PRIVY_APP_ID }}
          NEXT_PUBLIC_PRIVY_CLIENT_ID: ${{ vars.NEXT_PUBLIC_PRIVY_CLIENT_ID }}
          # PayRouta's NEAR Intents account, paid its fee at source on crypto
          # checkouts (lib/intents/checkout.ts feeAccount).
          PAYROUTA_INTENTS_FEE_ACCOUNT: ${{ vars.PAYROUTA_INTENTS_FEE_ACCOUNT }}
          # CoinGecko API key for crypto prices and token logos. Stored in the
          # server's secret store on the first deploy after it changes; the
          # server's .env keeps only its reference.
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          # NEAR Intents 1Click partner key (a JWT), stored the same way.
          ONECLICK_API_KEY: ${{ secrets.ONECLICK_API_KEY }}
          COINGECKO_API_PLAN: ${{ vars.COINGECKO_API_PLAN }}
          # x402 on NEAR (lib/x402): the relayer accounts that pay the gas, and
          # their full-access keys (stored like the API keys above). A network
          # without both isn't offered.
          X402_NEAR_MAINNET_RELAYER: ${{ vars.X402_NEAR_MAINNET_RELAYER }}
          X402_NEAR_TESTNET_RELAYER: ${{ vars.X402_NEAR_TESTNET_RELAYER }}
          X402_NEAR_MAINNET_RELAYER_KEY: ${{ secrets.X402_NEAR_MAINNET_RELAYER_KEY }}
          X402_NEAR_TESTNET_RELAYER_KEY: ${{ secrets.X402_NEAR_TESTNET_RELAYER_KEY }}
          # The ed25519 seed (hex) PayRouta signs agent-vault orders with
          # (lib/agents/vault.ts).
          PAYROUTA_AGENT_ORDER_KEY: ${{ secrets.PAYROUTA_AGENT_ORDER_KEY }}
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          envs: SHA,OPENSANCTIONS_API_KEY,TURNSTILE_SECRET_KEY,NEXT_PUBLIC_TURNSTILE_SITE_KEY,NEXT_PUBLIC_PRIVY_APP_ID,NEXT_PUBLIC_PRIVY_CLIENT_ID,PAYROUTA_INTENTS_FEE_ACCOUNT,COINGECKO_API_KEY,COINGECKO_API_PLAN,ONECLICK_API_KEY,X402_NEAR_MAINNET_RELAYER,X402_NEAR_TESTNET_RELAYER,X402_NEAR_MAINNET_RELAYER_KEY,X402_NEAR_TESTNET_RELAYER_KEY,PAYROUTA_AGENT_ORDER_KEY
          # The server is shared and often fully loaded: a full npm ci (when
          # the lockfile changes) has taken 23 minutes there.
          command_timeout: 45m
          script_stop: true
          script: |
            echo "==> Deploy started for SHA: $SHA"
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            elif [ -s "/root/.nvm/nvm.sh" ]; then
              export NVM_DIR="/root/.nvm"
              . "$NVM_DIR/nvm.sh"
            fi
            echo "==> Node: $(node -v 2>/dev/null || echo 'not found in PATH')"
            echo "==> NPM: $(npm -v 2>/dev/null || echo 'not found in PATH')"
            echo "==> PM2: $(which pm2 2>/dev/null || echo 'not found in PATH')"
            set -euo pipefail
            ROOT=/opt/payrouta
            # Sync secrets kept in GitHub into the server's .env, replacing
            # any old line; values are never printed.
            if [ -n "${OPENSANCTIONS_API_KEY:-}" ]; then
              (
                umask 077
                grep -v '^OPENSANCTIONS_API_KEY=' "$ROOT/.env" > "$ROOT/.env.sync" || true
                printf 'OPENSANCTIONS_API_KEY=%s\n' "$OPENSANCTIONS_API_KEY" >> "$ROOT/.env.sync"
                cat "$ROOT/.env.sync" > "$ROOT/.env"
                rm -f "$ROOT/.env.sync"
              )
              echo "==> OpenSanctions key synced from GitHub"
            fi
            sync_env() {
              [ -n "$2" ] || return 0
              (
                umask 077
                grep -v "^$1=" "$ROOT/.env" > "$ROOT/.env.sync" || true
                printf '%s=%s\n' "$1" "$2" >> "$ROOT/.env.sync"
                cat "$ROOT/.env.sync" > "$ROOT/.env"
                rm -f "$ROOT/.env.sync"
              )
              echo "==> $1 synced from GitHub"
            }
            sync_env TURNSTILE_SECRET_KEY "${TURNSTILE_SECRET_KEY:-}"
            sync_env NEXT_PUBLIC_TURNSTILE_SITE_KEY "${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}"
            sync_env NEXT_PUBLIC_PRIVY_APP_ID "${NEXT_PUBLIC_PRIVY_APP_ID:-}"
            sync_env NEXT_PUBLIC_PRIVY_CLIENT_ID "${NEXT_PUBLIC_PRIVY_CLIENT_ID:-}"
            sync_env PAYROUTA_INTENTS_FEE_ACCOUNT "${PAYROUTA_INTENTS_FEE_ACCOUNT:-}"
            if grep -q '^OPENSANCTIONS_API_KEY=.' "$ROOT/.env"; then
              echo "==> OpenSanctions key present: automated merchant screening on"
            else
              echo "==> OpenSanctions key missing: every business waits for manual review"
            fi
            REL="$ROOT/releases/$SHA"
            PREV="$(readlink -f "$ROOT/current" || true)"
            mkdir -p "$REL"
            echo "==> Extracting release archive..."
            tar -xzf "$ROOT/incoming/release.tgz" -C "$REL"
            ln -sfn "$ROOT/.env" "$REL/.env"
            cd "$REL"
            echo "==> Installing dependencies..."
            # Same lockfile as the live release: hard-link its node_modules
            # (seconds) instead of installing again (up to 23 minutes here).
            # script_stop checks the exit status after every line, an `else`
            # line included, so the choice is made on one line and no branch
            # starts after a failed test.
            REUSE=no; if [ -n "$PREV" ] && [ -d "$PREV/node_modules" ] && cmp -s "$PREV/package-lock.json" package-lock.json; then REUSE=yes; fi
            if [ "$REUSE" = yes ]; then
              echo "==> Lockfile unchanged: reusing node_modules from $PREV"
              cp -al "$PREV/node_modules" node_modules
            fi
            if [ "$REUSE" = no ]; then
              echo "==> Lockfile changed: installing (disk: $(df -h "$ROOT" | tail -1 | awk '{print $4}') free)"
              # npm's own reason, if it fails (stderr isn't always relayed).
              npm ci --prefer-offline --no-audit --no-fund > "$ROOT/npm-ci.log" 2>&1 || { echo "==> npm ci failed:"; tail -n 40 "$ROOT/npm-ci.log"; exit 1; }
            fi
            echo "==> Generating Prisma client..."
            npx prisma generate
            echo "==> Running database migrations..."
            npx prisma migrate deploy
            # API keys kept in GitHub: each goes into the secret store when it's
            # new or changed (recognised by its SHA-256), and only its reference
            # into .env. A failure leaves that service on its keyless API rather
            # than stop the deploy.
            store_key() {
              local name="$1" label="$2" value sha lines ref
              value="${!name:-}"
              [ -n "$value" ] || return 0
              sha="$(printf %s "$value" | sha256sum | cut -c1-64)"
              lines="$(printf '%s\n' "$value" | grep -c '[^[:space:]]' || true)"
              if [ "$lines" != 1 ] || [ "${#value}" -gt 4000 ] || ! printf '%s\n' "$value" | LC_ALL=C grep -Eq '^[[:space:]]*[!-~]+[[:space:]]*$'; then
                echo "==> $name isn't one key on one line; not stored. Set the GitHub secret to just the key"
              elif grep -q "^${name}_SHA256=$sha\$" "$ROOT/.env" && grep -q "^${name}_REF=." "$ROOT/.env"; then
                echo "==> $label key unchanged"
              elif ref="$(printf %s "$value" | npm run -s secrets:put 2>/dev/null | tail -n 1)" && printf %s "$ref" | grep -Eq '^[a-f0-9-]{36}$'; then
                sync_env "${name}_REF" "$ref"
                sync_env "${name}_SHA256" "$sha"
                echo "==> $label key stored"
              else
                echo "==> $label key could not be stored; $label stays on its keyless API"
              fi
            }
            store_key COINGECKO_API_KEY CoinGecko
            store_key ONECLICK_API_KEY 1Click
            sync_env COINGECKO_API_PLAN "${COINGECKO_API_PLAN:-}"
            store_key X402_NEAR_MAINNET_RELAYER_KEY "x402 mainnet relayer"
            store_key X402_NEAR_TESTNET_RELAYER_KEY "x402 testnet relayer"
            store_key PAYROUTA_AGENT_ORDER_KEY "Agent order signing"
            [ -z "${X402_NEAR_MAINNET_RELAYER:-}" ] || sync_env X402_NEAR_MAINNET_RELAYER "$X402_NEAR_MAINNET_RELAYER"
            [ -z "${X402_NEAR_TESTNET_RELAYER:-}" ] || sync_env X402_NEAR_TESTNET_RELAYER "$X402_NEAR_TESTNET_RELAYER"
            echo "==> Unpacking the app built in CI..."
            mkdir -p .next
            tar -xzf "$ROOT/incoming/build.tgz" -C .next
            test -f .next/standalone/server.js
            echo "==> Running production preflight..."
            npm run preflight:production -- --warn || true
            echo "==> Stopping legacy PM2 service if present..."
            pm2 stop payrouta 2>/dev/null || true
            pm2 delete payrouta 2>/dev/null || true
            echo "==> Switching current release link to $REL..."
            ln -sfn "$REL" "$ROOT/current"
            echo "==> Reloading PM2 services..."
            pm2 startOrReload "$REL/ecosystem.config.cjs" --update-env
            echo "==> Checking health endpoint (http://127.0.0.1:3051/api/health)..."
            ok=0
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:3051/api/health >/dev/null; then ok=1; break; fi
              sleep 3
            done
            if [ "$ok" != 1 ]; then
              echo "Health check failed; rolling back to $PREV"
              if [ -n "$PREV" ] && [ -d "$PREV" ]; then
                ln -sfn "$PREV" "$ROOT/current"
                if [ -f "$PREV/ecosystem.config.cjs" ]; then
                  pm2 startOrReload "$PREV/ecosystem.config.cjs" --update-env || true
                elif [ -f "$PREV/.next/standalone/server.js" ]; then
                  PORT=3051 pm2 start "$PREV/.next/standalone/server.js" --name "payrouta" || true
                fi
              fi
              exit 1
            fi
            echo "==> Health check passed! Saving PM2 state..."
            pm2 save
            # Old releases (each with its own node_modules) are removed in the
            # background at low priority, so a slow disk can't fail the deploy.
            ( ls -1dt "$ROOT"/releases/* | tail -n +6 | nohup nice -n 19 xargs -r rm -rf >/dev/null 2>&1 & )
            echo "==> Deployment finished successfully!"

