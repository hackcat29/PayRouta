name: Docs

# The Mintlify site in mintlify/ deploys through Mintlify's GitHub app
# (monorepo path: mintlify). This checks it builds and its links resolve
# before anything merges.
on:
  pull_request:
    paths: ["mintlify/**", "lib/merchant/contracts.ts", "scripts/mintlify-openapi.ts", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["mintlify/**", "lib/merchant/contracts.ts", "scripts/mintlify-openapi.ts", ".github/workflows/docs.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The merchant API reference must match the code.
      - run: npm run docs:openapi && git diff --exit-code mintlify/openapi/merchant.json
      # Pinned: mint 4.2.1182+ (30 October 2026) depends on an unpublished
      # @mintlify/scraping version and fails to install. Move to @latest
      # once a newer release installs again.
      - run: npx --yes mint@4.2.1133 validate
        working-directory: mintlify
      - run: npx --yes mint@4.2.1133 broken-links
        working-directory: mintlify
