services:
  web:
    build: .
    restart: always
    ports:
      # Bind to localhost to prevent direct external access, and use port 3029 to avoid conflicts with other apps
      - "127.0.0.1:3029:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      # Add other necessary production environment variables here
