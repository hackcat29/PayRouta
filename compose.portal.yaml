services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: payrouta
      POSTGRES_PASSWORD: local-fictional-only
      POSTGRES_DB: payrouta
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - portal_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payrouta"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  portal_pg:
