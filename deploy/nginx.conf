# /etc/nginx/sites-available/payrouta — replace example.com, then:
#   ln -s /etc/nginx/sites-available/payrouta /etc/nginx/sites-enabled/
#   certbot --nginx -d example.com
limit_req_zone $binary_remote_addr zone=payrouta_api:10m rate=20r/s;

server {
    listen 80;
    server_name example.com;

    # Bodies above this are refused before reaching the app (the app enforces
    # smaller per-route limits; provider webhooks allow up to 256 KiB).
    client_max_body_size 12m;

    # Shopify payment sessions arrive only on the mTLS host below.
    location /api/integrations/shopify/payments/ {
        return 404;
    }

    location /api/ {
        limit_req zone=payrouta_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3051;
        include /etc/nginx/snippets/payrouta-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3051;
        include /etc/nginx/snippets/payrouta-proxy.conf;
    }
}

# Shopify payments app (docs/shopify.md). Shopify calls payment and refund
# session URLs with mutual TLS, and ssl_verify_client only works per server,
# so these URLs get their own host (replace shopify-payments.example.com).
#   1. Save Shopify's CA chain (from Shopify's payments-app "Implementation
#      considerations" page) as /etc/nginx/shopify-payments-ca.pem.
#   2. Use a publicly trusted certificate for this host (certbot), not
#      Shopify's CA.
#   3. Put the same random value in /etc/nginx/snippets/payrouta-shopify-secret.conf
#      as:  set $payrouta_shopify_secret "<value>";
#      and in the vault, referenced by SHOPIFY_MTLS_PROXY_SECRET_REF.
server {
    listen 443 ssl;
    server_name shopify-payments.example.com;
    ssl_certificate     /etc/letsencrypt/live/shopify-payments.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shopify-payments.example.com/privkey.pem;
    ssl_client_certificate /etc/nginx/shopify-payments-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 3;
    client_max_body_size 64k;
    include /etc/nginx/snippets/payrouta-shopify-secret.conf;

    location /api/integrations/shopify/payments/ {
        limit_req zone=payrouta_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3051;
        include /etc/nginx/snippets/payrouta-proxy.conf;
        # Overwrite anything a client might send.
        proxy_set_header X-PayRouta-Client-Verify $ssl_client_verify;
        proxy_set_header X-PayRouta-Proxy-Secret $payrouta_shopify_secret;
    }

    location / {
        return 404;
    }
}
