# /etc/nginx/sites-available/payrouta — replace example.com, then:
#   ln -s /etc/nginx/sites-available/payrouta /etc/nginx/sites-enabled/
#   certbot --nginx -d example.com
limit_req_zone $binary_remote_addr zone=payrouta_api:10m rate=20r/s;

server {
    listen 80;
    server_name example.com;

    # Bodies above this are refused before reaching the app (the app enforces
    # smaller per-route limits; provider webhooks allow up to 256 KiB).
    client_max_body_size 12m;

    location /api/ {
        limit_req zone=payrouta_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3051;
        include /etc/nginx/snippets/payrouta-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3051;
        include /etc/nginx/snippets/payrouta-proxy.conf;
    }
}
