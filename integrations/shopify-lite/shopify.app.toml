# PayRouta for Shopify with a manual payment method: no Payments Partner
# approval. Create the app in the Partner Dashboard with custom distribution,
# replace the placeholders, then `shopify app deploy` from this directory.
# See docs/shopify.md.
#
# APP_ORIGIN  PayRouta's public origin (BETTER_AUTH_URL), e.g. https://pay.example

client_id = "REPLACE_WITH_SHOPIFY_LITE_API_KEY"
name = "PayRouta Pay now"
application_url = "https://APP_ORIGIN/merchant/developers/integrations"
embedded = false

[access_scopes]
scopes = "read_orders,write_orders"

[auth]
redirect_urls = ["https://APP_ORIGIN/api/integrations/shopify-lite/callback"]

[webhooks]
api_version = "2026-10"

  # orders/create needs protected customer data access (level 1, no
  # buyer details), requested under API access in the Partner Dashboard.
  [[webhooks.subscriptions]]
  topics = ["orders/create", "app/uninstalled"]
  uri = "https://APP_ORIGIN/api/integrations/shopify-lite/webhooks"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://APP_ORIGIN/api/integrations/shopify-lite/webhooks"
